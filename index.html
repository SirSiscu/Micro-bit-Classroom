<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Robòtica – Classroom</title>
<style>
  body{font-family:system-ui,sans-serif;display:flex;min-height:100vh;margin:0;align-items:center;justify-content:center;background:#f4f6f8;color:#222;text-align:center}
  main{padding:2rem;max-width:30rem}
  a.btn{display:inline-block;margin-top:1.2rem;padding:1rem 2rem;font-size:1.4rem;background:#2563eb;color:#fff;border-radius:.6rem;text-decoration:none}
  a.btn[aria-disabled="true"]{background:#999;pointer-events:none}
</style>
</head>
<body>
<main>
  <h1>Robòtica</h1>
  <p id="msg">Carregant l'enllaç del dia…</p>
  <a id="btn" class="btn" href="#" aria-disabled="true">Entrar al Classroom</a>
</main>
<script>
  const msg = document.getElementById('msg');
  const btn = document.getElementById('btn');
  fetch('enllac.txt?t=' + Date.now(), {cache: 'no-store'})
    .then(r => { if (!r.ok) throw new Error(); return r.text(); })
    .then(t => {
      const url = t.trim().split(/\s+/)[0];
      if (!/^https?:\/\//i.test(url)) throw new Error();
      btn.href = url;
      btn.removeAttribute('aria-disabled');
      msg.textContent = 'T\u2019hi estem portant…';
      window.location.replace(url);
    })
    .catch(() => { msg.textContent = 'No s\u2019ha pogut carregar l\u2019enllaç. Avisa el professor.'; });
</script>
</body>
</html>
